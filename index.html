/* 한 상(床)을 위에서 내려다본 구도: 백자 바탕, 청화(코발트) 잉크, 낙관(주홍) 한 점, 접시의 동심원 */
:root{
  --paper:#F2F4F8; --card:#FFFFFF; --ink:#121A36; --ink2:#47506E; --ink3:#7A839E; --line:#E2E6EF; --fill:#EBEEF5;
  --cobalt:#2440C4; --cobalt-press:#1B33A3; --cobalt-soft:#E7EBFC; --cobalt-ink:#1E37AE; --hero:#2440C4;
  --seal:#E4472B; --gold:#FFD45E;
  --ok:#17764A; --ok-bg:#DDF3E6; --warn:#8A5200; --warn-bg:#FBEAC0; --bad:#BC2A20; --bad-bg:#FCE2DF;
  --g-bg-s:82%; --g-bg-l:93%; --g-ink-s:62%; --g-ink-l:31%;
  --shadow:0 1px 2px rgba(18,26,54,.04),0 10px 28px rgba(18,26,54,.06);
  --ui:-apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","Segoe UI",Roboto,sans-serif;
  --display:"YH Display",var(--ui);
  --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0B0E1B; --card:#141929; --ink:#EDF0FA; --ink2:#B3BAD2; --ink3:#7F88A8; --line:#252C46; --fill:#1C2236;
    --cobalt:#4D69EA; --cobalt-press:#3F59D2; --cobalt-soft:#1D2650; --cobalt-ink:#B4C2FF; --hero:#1F38B4;
    --seal:#FF6A4D; --gold:#FFD76E;
    --ok:#76D7A2; --ok-bg:#12301F; --warn:#F2C55E; --warn-bg:#392C0B; --bad:#FF9186; --bad-bg:#431F1C;
    --g-bg-s:42%; --g-bg-l:21%; --g-ink-s:82%; --g-ink-l:84%;
    --shadow:none;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{background:var(--paper);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit;touch-action:manipulation}
h1,h2,h3,p{margin:0}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.d{font-family:var(--display);font-weight:800;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}

/* 워드마크의 콜론: 주홍 점 두 개 */
.colon{display:inline-block;position:relative;width:.3em;height:.74em;vertical-align:baseline}
.colon::before,.colon::after{content:"";position:absolute;left:50%;width:.17em;height:.17em;margin-left:-.085em;border-radius:50%;background:var(--seal)}
.colon::before{top:.2em}
.colon::after{bottom:.02em}

/* 만든 사람 서명: 손글씨 */
.sg{font-family:"YH Sign","Snell Roundhand","Segoe Script",cursive;font-weight:400;font-style:normal;letter-spacing:0;white-space:nowrap}
.wm{white-space:nowrap}

/* ───── 틀 ───── */
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:10;background:var(--paper);padding-top:env(safe-area-inset-top,0px)}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
  .top{background:color-mix(in srgb,var(--paper) 82%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px)}
}
.top .wrap{height:56px;display:flex;align-items:center;gap:8px}
.brand{font-size:23px;color:var(--cobalt);line-height:1;white-space:nowrap}
.top .sp{flex:1}
.sync{width:34px;height:34px;display:grid;place-items:center;color:var(--ink3);border-radius:12px}
.sync svg{width:19px;height:19px}
.sync.on svg{animation:spin .9s linear infinite}
.sync.off{color:var(--bad)}
@keyframes spin{to{transform:rotate(360deg)}}
.me{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 5px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;max-width:46vw}
.me .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;background:hsl(var(--h,226) var(--g-bg-s) var(--g-bg-l));color:hsl(var(--h,226) var(--g-ink-s) var(--g-ink-l))}
.me .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:6px 0 calc(var(--nav-h) + 34px + env(safe-area-inset-bottom,0px))}
main.in{animation:viewIn .22s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
  .nav{background:color-mix(in srgb,var(--card) 94%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px)}
}
.nav .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:600px;margin:0 auto;padding:7px 6px 6px;height:var(--nav-h)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:11px;font-weight:700;position:relative;white-space:nowrap}
.nav .ic{width:54px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s,color .2s}
.nav svg{width:22px;height:22px}
.nav button.on{color:var(--cobalt-ink)}
.nav button.on .ic{background:var(--cobalt-soft)}
.badge{position:absolute;top:-2px;left:calc(50% + 9px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--seal);color:#fff;font-size:10.5px;line-height:17px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}

/* ───── 공통 부품 ───── */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:8px;padding:0 4px 10px}
.sec-h h2{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.2}
.sec-h .cnt{font-size:13px;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums}
.sec-h .more{margin-left:auto;font-size:13px;font-weight:700;color:var(--cobalt-ink);padding:4px 2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.empty{padding:22px 16px;color:var(--ink3);font-size:14px;text-align:center}
.sub{color:var(--ink2);font-size:13px}
.mute{color:var(--ink3)}

.g{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:800;white-space:nowrap;
  background:hsl(var(--h,226) var(--g-bg-s) var(--g-bg-l));color:hsl(var(--h,226) var(--g-ink-s) var(--g-ink-l))}
.g.plain{background:var(--fill);color:var(--ink2)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:800;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.none{background:var(--fill);color:var(--ink2)} .tag.cob{background:var(--cobalt-soft);color:var(--cobalt-ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:52px;padding:0 20px;border-radius:16px;background:var(--cobalt);color:#fff;font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;transition:transform .08s,background .15s,opacity .15s;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.98);background:var(--cobalt-press)}
.btn:disabled{opacity:.55}
a.btn{text-decoration:none}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;flex:none}
.btn svg{width:19px;height:19px}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 13px;border-radius:12px;font-size:13px}
.btn.soft{background:var(--cobalt-soft);color:var(--cobalt-ink)}
.btn.soft:active{background:var(--cobalt-soft);filter:brightness(.96)}
.btn.ghost{background:var(--fill);color:var(--ink)}
.btn.ghost:active{background:var(--line)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.line:active{background:var(--fill)}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--bad)}
.btn.danger:active{background:var(--bad-bg)}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--ink2);flex:none}
.icon-btn:active{background:var(--fill)}
.icon-btn svg{width:21px;height:21px}

/* ───── 홈 ───── */
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--hero);color:#fff;padding:20px 20px 16px;box-shadow:0 14px 34px rgba(36,64,196,.28)}
@media (prefers-color-scheme: dark){.hero{box-shadow:none}}
.rings{position:absolute;right:-84px;top:-104px;width:270px;height:270px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);pointer-events:none}
.rings::before{content:"";position:absolute;inset:30px;border-radius:50%;border:1.5px solid rgba(255,255,255,.15)}
.rings::after{content:"";position:absolute;inset:-38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.1)}
.hero-top{position:relative;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:rgba(255,255,255,.82)}
.live{white-space:nowrap;margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:13px;background:rgba(255,255,255,.16);color:#fff;font-size:12px;font-weight:800}
.live i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55)}
.live.busy i{background:var(--seal);box-shadow:0 0 0 0 rgba(228,71,43,.7);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{to{box-shadow:0 0 0 8px rgba(228,71,43,0)}}
.hero h1{position:relative;font-family:var(--display);font-weight:800;font-size:27px;line-height:1.24;letter-spacing:-.025em;margin-top:14px;text-wrap:balance;max-width:17em}
.hero p{position:relative;margin-top:6px;font-size:14px;color:rgba(255,255,255,.84)}

.tl{position:relative;height:40px;margin-top:16px}
.tl .track{position:absolute;left:0;right:0;top:0;height:24px;border-radius:8px;background:var(--fill);overflow:hidden}
.tl .blk{position:absolute;top:0;bottom:0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;
  background:hsl(var(--h,226) var(--g-bg-s) calc(var(--g-bg-l) - 6%));color:hsl(var(--h,226) var(--g-ink-s) var(--g-ink-l))}
.tl .blk.plain{background:var(--line);color:var(--ink2)}
.tl .blk.pick{background:var(--cobalt);color:#fff;z-index:1}
.tl .blk.pick.bad{background:var(--bad)}
.tl .now{position:absolute;top:-4px;width:2px;height:32px;margin-left:-1px;border-radius:1px;background:var(--seal);z-index:2}
.tl .now::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--seal)}
.tl .ticks{position:absolute;left:0;right:0;top:28px;height:12px;font-size:10px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.tl .ticks span{position:absolute;transform:translateX(-50%);line-height:12px;white-space:nowrap}
.tl .ticks span:first-child{transform:none}
.tl .ticks span:last-child{transform:translateX(-100%)}
.tl.on-hero .track{background:rgba(255,255,255,.16)}
.tl.on-hero .blk,.tl.on-hero .blk.plain{background:#fff;color:#2440C4}
.tl.on-hero .ticks{color:rgba(255,255,255,.62)}

.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:800;transition:transform .08s}
.quick button:active{transform:scale(.97)}
.quick .qi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--cobalt-soft);color:var(--cobalt-ink)}
.quick .qi svg{width:21px;height:21px}

.bk{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%}
.bk:first-child{border-top:0}
.dblk{width:46px;flex:none;text-align:center}
.dblk b{display:block;font-family:var(--display);font-weight:800;font-size:23px;line-height:1.05;letter-spacing:-.02em}
.dblk span{display:block;margin-top:3px;font-size:10.5px;font-weight:800;color:var(--ink3);white-space:nowrap}
.dblk.sun span{color:var(--bad)} .dblk.sat span{color:var(--cobalt-ink)}
.bk-m{flex:1;min-width:0}
.bk-t{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-weight:800;line-height:1.3}
.bk-t .time{font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.bk-s{margin-top:3px;font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.bk-r{flex:none;font-size:12px;font-weight:800;color:var(--ink3);white-space:nowrap}
.mine-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--seal);flex:none}

.mygroup{display:flex;align-items:center;gap:14px;padding:16px;width:100%}
.mygroup .k{font-size:12px;font-weight:800;color:var(--ink3)}
.mygroup .v{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1.25;margin-top:2px}
.mygroup .s{font-size:13px;color:var(--ink2);margin-top:2px;overflow-wrap:anywhere}
.dday{flex:none;min-width:58px;height:58px;border-radius:50%;border:1.5px solid var(--cobalt);color:var(--cobalt-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;position:relative}
.dday::before{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid var(--cobalt);opacity:.35}

.todo{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%}
.todo:first-child{border-top:0}
.todo .ti{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.todo .ti svg{width:19px;height:19px}
.todo .ti.warn{background:var(--warn-bg);color:var(--warn)} .todo .ti.bad{background:var(--bad-bg);color:var(--bad)}
.todo .tt{font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}

details.notice{border-top:1px solid var(--line)}
details.notice:first-child{border-top:0}
details.notice summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:800;cursor:pointer}
details.notice summary::-webkit-details-marker{display:none}
details.notice summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg) translate(-2px,-2px);transition:transform .18s;flex:none}
details.notice[open] summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
details.notice p{white-space:pre-wrap;font-size:14px;line-height:1.65;color:var(--ink2);padding:0 16px 16px;overflow-wrap:anywhere}

.log{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line);font-size:13px}
.log:first-child{border-top:0}
.log .lw{flex:1;min-width:0}
.log .la{font-weight:800}
.log .ld{color:var(--ink2);overflow-wrap:anywhere}
.log .lt{flex:none;color:var(--ink3);font-size:12px;font-weight:700;white-space:nowrap}

.foot{margin:34px 4px 0;display:flex;gap:12px;align-items:center;color:var(--ink3);font-size:12px;line-height:1.5}
.stamp{width:40px;height:40px;border-radius:9px;background:var(--seal);color:#fff;display:grid;place-content:center;text-align:center;font-family:var(--display);font-weight:800;font-size:13px;line-height:1.08;letter-spacing:-.02em;flex:none;transform:rotate(-4deg)}
.stamp span{display:block}
.foot .why{display:block;margin-top:3px;color:var(--cobalt-ink);font-weight:700;line-height:1.5;text-align:left;text-wrap:balance}
.foot .why .sg{font-size:1.3em;line-height:1;color:var(--seal)}

/* ───── 예약 ───── */
.vt{display:flex;align-items:flex-end;gap:8px;padding:8px 4px 14px}
.vt h1{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;letter-spacing:-.03em}
.vt .yr{font-size:13px;font-weight:800;color:var(--ink3);padding-bottom:3px;font-variant-numeric:tabular-nums}
.vt .sp{flex:1}
.swt{display:inline-flex;background:var(--fill);border-radius:12px;padding:3px}
.swt button{white-space:nowrap;height:30px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:800;color:var(--ink3)}
.swt button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(18,26,54,.12)}
.cal-nav{display:flex;align-items:center;gap:2px;margin:-4px 0 10px}
.cal-nav .sp{flex:1}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:11px;font-weight:800;color:var(--ink3);padding:2px 0 4px}
.dow.sun{color:var(--bad)} .dow.sat{color:var(--cobalt-ink)}
.day{min-height:68px;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:5px 3px 4px;display:flex;flex-direction:column;align-items:stretch;gap:3px;overflow:hidden;transition:box-shadow .12s,border-color .12s}
.day .n{align-self:flex-start;min-width:22px;height:22px;padding:0 3px;border-radius:11px;font-size:12.5px;font-weight:800;line-height:22px;text-align:center;font-variant-numeric:tabular-nums}
.day.sun .n{color:var(--bad)} .day.sat .n{color:var(--cobalt-ink)}
.day.past .n{opacity:.5}
.day.today .n{background:var(--cobalt);color:#fff;opacity:1}
.day.out{background:transparent;border-color:transparent}
.day.out .n,.day.out .pill{opacity:.3}
.day.sel{border-color:var(--cobalt);box-shadow:0 0 0 1.5px var(--cobalt)}
.pill{display:block;height:17px;padding:0 4px;border-radius:6px;font-size:10.5px;font-weight:800;line-height:17px;white-space:nowrap;overflow:hidden;text-align:center;
  background:hsl(var(--h,226) var(--g-bg-s) var(--g-bg-l));color:hsl(var(--h,226) var(--g-ink-s) var(--g-ink-l))}
.pill.plain{background:var(--fill);color:var(--ink2)}
.pill.mine{box-shadow:inset 0 0 0 1.5px currentColor}
.day .more{font-size:10px;font-weight:800;color:var(--ink3);text-align:center;line-height:11px}
.dayp{margin-top:14px}
.dayp-h{display:flex;align-items:baseline;gap:8px;padding:16px 16px 0}
.dayp-h h2{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.dayp-h span{font-size:13px;font-weight:800;color:var(--ink3)}
.dayp .tl{margin:14px 16px 4px}
.dayp .act{padding:14px 16px 16px}
.mon-h{font-family:var(--display);font-weight:800;font-size:18px;padding:18px 4px 8px}
.mon-h:first-child{padding-top:0}

/* ───── 재고 · 도구 ───── */
.stat{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--fill);gap:2px}
.stat i{display:block;height:100%;min-width:3px;border-radius:2px}
.stat .s-ok{background:var(--ok)} .stat .s-warn{background:#D9A21B} .stat .s-bad{background:var(--bad)} .stat .s-none{background:var(--ink3);opacity:.45}
.tools{display:flex;gap:8px;margin:14px 0 10px}
.field-search{position:relative;flex:1;min-width:0}
.field-search svg{position:absolute;left:13px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--ink3);pointer-events:none}
.field-search .f{padding-left:40px}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:800;color:var(--ink2)}
.fchip b{font-variant-numeric:tabular-nums;color:var(--ink3);font-weight:800}
.fchip i{width:8px;height:8px;border-radius:50%}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.fchip.on b{color:var(--paper);opacity:.7}
.cat{display:flex;align-items:center;gap:8px;margin:20px 4px 8px;font-size:13px;font-weight:800;color:var(--ink2)}
.cat:first-child{margin-top:6px}
.cat .n{color:var(--ink3);font-variant-numeric:tabular-nums}
.cat .all{margin-left:auto}
.it{display:flex;align-items:center;gap:8px;padding:9px 9px 9px 14px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it-m{flex:1;min-width:0;padding:3px 0}
.it-n{display:block;font-weight:800;overflow-wrap:anywhere;line-height:1.35}
.it-n small{font-weight:700;color:var(--ink3);margin-left:5px;font-size:12px}
.it-s{display:block;margin-top:1px;font-size:12px;color:var(--ink3);overflow-wrap:anywhere}
.seg{display:flex;flex:none;gap:2px;padding:3px;border-radius:12px;background:var(--fill)}
.seg button{white-space:nowrap;min-width:43px;height:32px;padding:0 6px;border-radius:9px;font-size:12.5px;font-weight:800;color:var(--ink3);text-align:center;transition:background .14s,color .14s}
.seg .s-ok.on{background:var(--ok-bg);color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.seg .s-warn.on{background:var(--warn-bg);color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
.seg .s-bad.on{background:var(--bad-bg);color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}

/* ───── 시트(모달) ───── */
#sheet{position:fixed;inset:0;z-index:30;display:none}
#sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(8,12,30,.52);opacity:0;transition:opacity .24s}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--paper);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.85,.25,1)}
#sheet.show .backdrop{opacity:1}
#sheet.show .panel{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sh-h h1{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.02em;flex:1;min-width:0}
.fld{margin-bottom:13px}
.fld label,.lbl{display:block;font-size:12.5px;font-weight:800;color:var(--ink2);margin:0 2px 6px}
.f{display:block;width:100%;height:50px;padding:0 14px;border-radius:14px;border:1.5px solid transparent;background:var(--fill);color:var(--ink);font-size:16px;font-weight:600;outline:0;-webkit-appearance:none;appearance:none;transition:border-color .15s,background .15s}
.f::placeholder{color:var(--ink3);font-weight:500}
.f:focus{border-color:var(--cobalt);background:var(--card)}
.panel .f{background:var(--card);border-color:var(--line)}
.panel .f:focus{border-color:var(--cobalt)}

<script type="text/plain" id="letter">
안녕하십니까 요리:하다를 만든 20학번 박재현입니다.

저는 학교에 들어와서 하나의 "회_會" 를 만들어보고 싶었는데요,
기왕이면 제가 만들 "회" 에서 여러분들의 인생에 남는 긍정적인 영향을 주고 싶었습니다.

여러분들은 힘든 입시를 겪고, 의과대학에 입학하셨기에, 별 무리가 없는 한, 의사가 되실텐데요.
그 말인즉슨, 여러분들의 삶이 많이 바빠질 시기도 있고,
또 많은 경험을 할수 있는 능력또한 여러분들이 가지실수 있다는 말입니다.

그런 삶 속에서, 아무리 바쁘고 힘겨워지더라도, 하루에 몇번씩 경험하게되는게 바로 "식문화" 이더라구요 ㅎ.

자취를 하면서도 5분만에 스테이크를 해먹을수 있는 달란트,
병원에서 당직을 서면서 커피를 마실때에 내가 어떤 원두를 선택하면 왜, 어떤 맛이 나는지 알고 그때라도 잠시 취향을 실현할수있는 그 자아실현감.
친구들이랑 기분낼때, 같은 값이라면 소주말고 수제맥주나 와인, 위스키를 더 잘 즐길수 있게 하는 준비.
그냥 다 필요없고 맛난걸 더 행복하게 잘 즐길수있는 그정도의 두뇌.

인생이라는걸 살아가는데 이 정도를 여러분들이 Take home message 하면, 하루에도 여러번 행복을 더 느끼실수 있지 않을까? ㅎㅎ 라는 생각에 만들어봤습니다 ㅎ.

이 동아리는 최대한 많은 사람에게 선한 영향력을 올바른 방향으로 나누는것에 쓰였으면 합니다.
그렇기에, 제가 여러분들께 제공하는 요리공간도 동아리부원과 함께라면 동아리부원이 아닌 사람과 어울려서 시간을 보내도 좋고, 최대한 모든 활동들이 세상에 선과 옳음을 관철하는 방향을 향해 있었으면 합니다.

여러분들의 앞날에 행복이 가득하길 바라며, 글을 마무리하겠습니다.

/* ───────── 부품 ───────── */

      : '<div class="fld"><label for="lg_pw">동아리 비밀번호</label><input class="f pin" id="lg_pw" type="password" inputmode="numeric" autocomplete="off" maxlength="20" aria-describedby="lg_help"></div>' +

        '<div class="sub" id="lg_help" style="margin-top:12px;text-align:center;text-wrap:balance">비밀번호는 동아리 단톡방 공지를 확인해 주세요.</div>') +
    '</div>' + whyHtml() + '</div></div>';
  if (!S.signed) {
    // 서명이 써지는 움직임은 처음 한 번만. 사진은 편지를 열기 전에 미리 받아 둔다.
    S.signed = true;
    setTimeout(function () { try { new Image().src = PHOTO; } catch (e) {} }, 1500);
  }
  var first = $('#lg_name') || $('#lg_pw');
  if (first && !('ontouchstart' in window)) { try { first.focus(); } catch (e) {} }
}

/* ───────── 만든 사람의 편지 ───────── */
/** 편지 원문(#letter)을 문단과 줄 그대로 옮긴다. 빈 줄이 문단, 줄바꿈이 한 줄. */
function letterHtml() {
  var src = $('#letter');
  var raw = ((src && src.textContent) || '').replace(/\r/g, '').replace(/^\s+|\s+$/g, '');
  if (!raw) return '';
  return raw.split(/\n[ \t]*\n+/).map(function (p, i) {
    return '<p' + (i === 0 ? ' class="lead d"' : '') + '>' + p.split('\n').map(function (l) { return '<span>' + esc(l.replace(/\s+$/, '')) + '</span>'; }).join('') + '</p>';
  }).join('');
}
function founderSheet() {
  var club = (S.data && S.data.club) || CLUB;
  openSheet(
    '<div class="sh-h fd-h"><h1 class="d">' + lockupHtml(club) + '</h1><button class="icon-btn" data-act="closeSheet" aria-label="닫기">' + icon('x') + '</button></div>' +
    '<article class="fd"><div class="fd-ph"><i></i><img src="' + PHOTO + '" width="148" height="148" alt="' + esc(FOUNDER) + '" decoding="async"></div>' +
    letterHtml() +
    '<div class="fd-sign"><span class="sg">' + SIGN.replace(/^by\s+/, '') + '</span><span class="stamp d"><span>요리</span><span>하다</span></span></div></article>' +
    '<div class="acts"><button class="btn ghost" data-act="closeSheet">닫기</button></div>');
}
function profileSheet() {
  var d = S.data, ua = navigator.userAgent || '';
  var inApp = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua);
  var guide = inApp
    ? '<b>홈 화면에 추가하려면</b> 먼저 ' + (ios ? 'Safari' : 'Chrome') + '로 열어 주세요. 화면 ' + (ios ? '아래 공유 버튼에서 "Safari로 열기"' : '오른쪽 위 메뉴에서 "다른 브라우저로 열기"') + '를 누르면 돼요.'
    : ios ? '<b>홈 화면에 추가하기</b> Safari 아래쪽 공유 버튼을 누르고 "홈 화면에 추가"를 고르면 앱처럼 쓸 수 있어요.'
      : '<b>홈 화면에 추가하기</b> 브라우저 메뉴에서 "홈 화면에 추가" 또는 "앱 설치"를 고르면 앱처럼 쓸 수 있어요.';
  openSheet(
    '<div class="sh-h"><h1>내 정보</h1><button class="icon-btn" data-act="closeSheet" aria-label="닫기">' + icon('x') + '</button></div><div id="formMsg"></div>' +
    '<div class="fld"><label for="pf_name">이름</label><input class="f" id="pf_name" maxlength="30" autocomplete="name" value="' + esc(S.auth.name) + '"></div>' +
    '<div class="fld"><label for="pf_group">조</label><select class="f" id="pf_group">' + opts(withValue(d ? d.groups : [], S.auth.group), S.auth.group) + '</select></div>' +
    '<div class="acts" style="margin-top:6px"><button class="btn" data-act="saveProfile">저장</button></div>' +
    '<div class="guide">' + guide + '</div>' +
    '<div class="links"><button class="btn ghost" data-act="copyLink">' + icon('copy') + '주소 복사하기</button>' +
    (d && d.sheetUrl ? '<a class="btn ghost" href="' + esc(d.sheetUrl) + '" target="_blank" rel="noopener">' + icon('sheet') + '관리자용 시트 열기</a>' : '') +
    '<button class="btn line" data-act="logout">로그아웃</button></div>' +
    '<div class="ver">' + esc((d && d.org) || ORG) + ' · v' + APP_VERSION + '</div>');
}

/* ───────── 시트(모달) ───────── */
function openSheet(html) {
  var sh = $('#sheet');
  $('#panel').innerHTML = '<div class="grab"></div>' + html;
  $('#panel').scrollTop = 0;
  if (!S.sheetOpen) {
    S.sheetOpen = true;
    sh.classList.add('open');
    void sh.offsetWidth;
    sh.classList.add('show');
    document.body.style.overflow = 'hidden';
    try { history.pushState({ sheet: 1 }, ''); } catch (e) {}
  }
}
function closeSheet(fromPop) {
  if (!S.sheetOpen) return;
  S.sheetOpen = false;
  var sh = $('#sheet');
  sh.classList.remove('show');
  document.body.style.overflow = '';
  setTimeout(function () { if (!S.sheetOpen) { sh.classList.remove('open'); $('#panel').innerHTML = ''; } }, 320);
  if (!fromPop) { try { if (history.state && history.state.sheet) { S.ignorePop = true; history.back(); } } catch (e) {} }
}
function syncHash() {
  if (!(S.auth && S.auth.token && S.auth.name)) return;   // 로그인 화면에서는 주소에 탭을 붙이지 않는다
  try { if ((location.hash || '').slice(1) !== S.tab) history.replaceState(history.state, '', '#' + S.tab); } catch (e) {}
}
function formMsg(msg, kind) {
  var e = $('#formMsg');
  if (!e) return toast(msg);
  e.innerHTML = '<div class="msg ' + (kind || 'err') + '">' + esc(msg) + '</div>';
  try { e.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (x) {}
}
function val(id) { var e = $('#' + id); return e ? String(e.value).trim() : ''; }
function armed(btn, label) {
  if (btn.getAttribute('data-armed')) {
    btn.removeAttribute('data-armed');
    btn.innerHTML = btn._label || btn.innerHTML;
    return true;
  }
  btn._label = btn.innerHTML;
  btn.setAttribute('data-armed', '1'); btn.textContent = label || '한 번 더 누르면 삭제';
  setTimeout(function () { if (btn.isConnected && btn.getAttribute('data-armed')) { btn.removeAttribute('data-armed'); btn.innerHTML = btn._label; } }, 3200);
  return false;
}
/** 버튼을 '~하는 중' 상태로 바꾸고, 되돌리는 함수를 돌려준다 */
function working(btn, label) {
  var old = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>' + esc(label);
  return function () { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } };
}
function submit(btn, action, payload, okMsg, label) {
  var done = working(btn, label || '저장하는 중');
  return rpc(action, payload).then(function (r) {
    done();
    if (r.ok) { closeSheet(); render(true); if (okMsg) toast(okMsg); return r; }
    if (r.error === 'AUTH') { authFail(); return r; }
    if (r.error === 'OVERLAP') {
      var c = r.conflict || {};
      formMsg('그 시간에는 이미 예약이 있어요: ' + c.start + '–' + c.end + ' ' + c.group + (c.name && c.name !== c.group ? ' ' + c.name : ''));
      paintBookingHint(); render(true);
    } else formMsg(errText(r));
    return r;
  });
}
function findBy(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }

/* ───────── 동작 ───────── */
var ACT = {
  tab: function (el) { go(el.getAttribute('data-tab')); },
  profile: profileSheet,
  founder: founderSheet,
  closeSheet: function () { closeSheet(); },
  backdrop: function () { closeSheet(); },

  login1: function (el) {
    var pw = val('lg_pw');
    if (!pw) return formMsg('비밀번호를 입력해 주세요.');
    var done = working(el, '확인하는 중');
    rpc('login', { pw: pw }).then(function (r) {
      done();
      if (r.ok && r.token) {
        var keep = S.auth || {};
        S.auth = { token: r.token, name: keep.name || '', group: keep.group || '' };
        if (S.auth.name && S.data.groups.indexOf(S.auth.group) >= 0) { LS.set('yh2_auth', S.auth); render(); }
        else renderLogin();
      } else {
        formMsg(r.error === 'AUTH' ? '비밀번호가 맞지 않아요.' : r.error === 'LOCKED' ? '여러 번 틀려서 잠시 막혔어요. 10분 뒤에 다시 시도해 주세요.' : errText(r));
        var f = $('#lg_pw'); if (f) { f.value = ''; try { f.focus(); } catch (e) {} }
      }
    });
  },
  login2: function () {
    var name = val('lg_name');
    if (!name) return formMsg('이름을 입력해 주세요.');
    S.auth = { token: S.auth.token, name: name, group: val('lg_group') };
    LS.set('yh2_auth', S.auth);
    render();
  },
  saveProfile: function () {
    var name = val('pf_name');
    if (!name) return formMsg('이름을 입력해 주세요.');
    S.auth.name = name; S.auth.group = val('pf_group');
    LS.set('yh2_auth', S.auth);
    closeSheet(); S.dataJson = ''; render(true); toast('저장했어요');
  },
  logout: function (el) {
    if (!armed(el, '한 번 더 누르면 로그아웃')) return;
    S.auth = null; LS.del('yh2_auth'); LS.del('yh2_data'); S.data = null;
    closeSheet(); renderLogin();
  },
  copyLink: function () {
    var url = (S.data && S.data.site) || location.href.split('#')[0];
    var done = function () { toast('주소를 복사했어요'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function () { formMsg(url, 'info'); });
    else formMsg(url, 'info');
  },

  calMode: function (el) { S.calMode = el.getAttribute('data-m'); LS.set('yh2_ui', { calMode: S.calMode }); render(true); },
  calMove: function (el) {
    var p = S.ym.split('-'), d = new Date(+p[0], +p[1] - 1 + (+el.getAttribute('data-n')), 1);
    S.ym = ymd(d).slice(0, 7);
    S.sel = S.ym === today().slice(0, 7) ? today() : S.ym + '-01';
    render(true);
  },
  calToday: function () { S.sel = today(); S.ym = S.sel.slice(0, 7); render(true); },
  selDay: function (el) {
    S.sel = el.getAttribute('data-date'); S.ym = S.sel.slice(0, 7);
    if (S.tab !== 'cal') { S.calMode = 'grid'; go('cal'); } else render(true);
  },
  newBk: function (el) { bookingSheet(null, el.getAttribute('data-date') || S.sel); },
  editBk: function (el) { var b = findBy(S.data.bookings, el.getAttribute('data-id')); if (b) bookingSheet(b); },
  dur: function (el) {
    var s = toMin(val('bk_start')), e = Math.min(1440, s + (+el.getAttribute('data-h')) * 60);
    $('#bk_end').value = fromMin(e);
    paintBookingHint();
  },
  saveBk: function (el) {
    var p = { id: val('bk_id'), date: val('bk_date'), start: val('bk_start'), end: val('bk_end'), type: val('bk_type'), group: val('bk_group'), name: val('bk_name'), memo: val('bk_memo') };
    if (!p.date) return formMsg('날짜를 골라 주세요.');
    if (p.start >= p.end) return formMsg('끝나는 시간이 시작 시간보다 늦어야 해요.');
    if (bookingConflict()) return formMsg('다른 예약과 시간이 겹쳐요. 시간을 바꿔 주세요.');
    if (!p.name) return formMsg('예약자 이름을 입력해 주세요.');
    submit(el, 'saveBooking', p, p.id ? '예약을 고쳤어요' : '예약했어요').then(function (r) {
      if (r.ok) { S.sel = p.date; S.ym = p.date.slice(0, 7); if (S.tab !== 'cal') { S.calMode = 'grid'; go('cal'); } else render(true); }
    });
  },
  delBk: function (el) { if (armed(el)) submit(el, 'deleteBooking', { id: el.getAttribute('data-id') }, '예약을 지웠어요', '지우는 중'); },

  filter: function (el) { var k = el.getAttribute('data-kind'); S.f[k] = el.getAttribute('data-f'); paintItems(k); },
  goNeed: function (el) { var k = el.getAttribute('data-kind'); S.f[k] = 'need'; S.q[k] = ''; go(k); },
  setSt: function (el) {
    var kind = el.getAttribute('data-kind'), id = el.getAttribute('data-id');
    var it = findBy(S.data[KIND[kind].store], id);
    if (!it) return;
    var prev = { status: it.status, by: it.by, at: it.at }, want = el.getAttribute('data-st');
    var next = prev.status === want ? '미확인' : want;
    it.status = next; it.by = S.auth.name; it.at = today() + ' ' + nowHM();
    paintItems(kind);
    try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {}
    rpc('setStatus', { kind: kind, id: id, status: next, lite: true }).then(function (r) {
      if (r.ok) { S.stale = true; LS.set('yh2_data', S.data); return; }
      if (r.error === 'AUTH') return authFail();
      it.status = prev.status; it.by = prev.by; it.at = prev.at;
      if (S.tab === kind) paintItems(kind);
      toast(errText(r));
    });
  },
  bulk: function (el) {
    var kind = el.getAttribute('data-kind'), K = KIND[kind], cat = el.getAttribute('data-cat');
    if (!armed(el, '한 번 더 누르면 적용')) return;
    var ids = S.data[K.store].filter(function (it) { return it.cat === cat && it.status === '미확인'; }).map(function (it) { return it.id; });
    var done = working(el, '바꾸는 중');
    rpc('setStatusBulk', { kind: kind, ids: ids, status: K.good }).then(function (r) {
      if (r.ok) { render(true); paintItems(kind); toast(cat + ' ' + ids.length + '개를 ' + K.good + '으로 바꿨어요'); }
      else if (r.error === 'AUTH') authFail();
      else { done(); toast(errText(r)); }
    });
  },
  newItem: function (el) { itemSheet(el.getAttribute('data-kind'), null); },
  editItem: function (el) {
    var kind = el.getAttribute('data-kind');
    var it = findBy(S.data[KIND[kind].store], el.getAttribute('data-id'));
    if (it) itemSheet(kind, it);
  },
  saveItem: function (el) {
    var kind = el.getAttribute('data-kind');
    var item = { id: val('it_id'), name: val('it_name'), cat: val('it_cat'), qty: val('it_qty'), loc: val('it_loc'), memo: val('it_memo'), status: val('it_status') };
    if (!item.name) return formMsg('품목 이름을 입력해 주세요.');
    submit(el, 'saveItem', { kind: kind, item: item }, '저장했어요');
  },
  delItem: function (el) { if (armed(el)) submit(el, 'deleteItem', { kind: el.getAttribute('data-kind'), id: el.getAttribute('data-id') }, '지웠어요', '지우는 중'); },

  quickCheck: function () {
    var nc = checkable();
    var mine = nc.filter(function (b) { return b.group === S.auth.group; })[0];
    if (mine) checkSheet(mine); else if (nc.length) go('check'); else checkSheet(null);
  },
  openCheck: function (el) { checkSheet(el.getAttribute('data-id') ? findBy(S.data.bookings, el.getAttribute('data-id')) : null); },
  ckAll: function () { $$('input[name="ck"]').forEach(function (x) { x.checked = true; }); paintCkCount(); },
  cycIng: function (el) {
    var next = { '': '부족', '부족': '없음', '없음': '' }[el.getAttribute('data-st')];
    el.setAttribute('data-st', next);
    el.textContent = el.getAttribute('data-name') + (next ? ' · ' + next : '');
    var n = $$('.pk[data-act="cycIng"]').filter(function (x) { return x.getAttribute('data-st'); }).length;
    $('#lowN').textContent = n ? n + '개' : '';
  },
  togTool: function (el) {
    el.classList.toggle('on');
    var n = $$('.pk.on[data-act="togTool"]').length;
    $('#badN').textContent = n ? n + '개' : '';
  },
  submitCheck: function (el) {
    var boxes = $$('input[name="ck"]');
    var p = {
      bookingId: val('ck_bid'), date: val('ck_date'), group: val('ck_group'), by: val('ck_by'), memo: val('ck_memo'),
      done: boxes.filter(function (x) { return x.checked; }).map(function (x) { return x.value; }),
      notDone: boxes.filter(function (x) { return !x.checked; }).map(function (x) { return x.value; }),
      low: $$('.pk[data-act="cycIng"]').filter(function (x) { return x.getAttribute('data-st'); }).map(function (x) { return { id: x.getAttribute('data-id'), status: x.getAttribute('data-st') }; }),
      bad: $$('.pk.on[data-act="togTool"]').map(function (x) { return x.getAttribute('data-id'); })
    };
    if (!p.date) return formMsg('날짜를 골라 주세요.');
    if (!p.by) return formMsg('작성자 이름을 입력해 주세요.');
    var done = working(el, '제출하는 중');
    rpc('submitCheck', p).then(function (r) {
      done();
      if (r.ok) {
        render(true);
        $('#panel').innerHTML = '<div class="grab"></div><div class="done"><div class="mark">' + icon('tick') + '</div><h2>수고하셨어요</h2><p>' + (p.notDone.length ? '남은 뒷정리 ' + p.notDone.length + '가지도 기록해 뒀어요.' : '뒷정리 기록을 남겼어요.') + '</p></div><div class="acts"><button class="btn" data-act="closeSheet">닫기</button></div>';
        $('#panel').scrollTop = 0;
      } else if (r.error === 'AUTH') authFail();
      else formMsg(errText(r));
    });
  }
};

document.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!el || el.disabled) return;
  var fn = ACT[el.getAttribute('data-act')];
  if (fn) fn(el, ev);
});
document.addEventListener('input', function (ev) {
  var id = ev.target.id;
  if (id === 'q') { var k = ev.target.getAttribute('data-kind'); S.q[k] = ev.target.value; $('#list').innerHTML = itemList(k); }
});
document.addEventListener('change', function (ev) {
  var id = ev.target.id;
  if (id === 'bk_start') {
    var s = toMin(val('bk_start')), e = toMin(val('bk_end'));
    if (e <= s) $('#bk_end').value = fromMin(Math.min(1440, s + 180));
  }
  if (id === 'bk_date' || id === 'bk_start' || id === 'bk_end') paintBookingHint();
  if (ev.target.name === 'ck') paintCkCount();
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && ev.target.id === 'lg_pw') { var b = $('[data-act="login1"]'); if (b) b.click(); }
  if (ev.key === 'Enter' && ev.target.id === 'lg_name') { var c = $('[data-act="login2"]'); if (c) c.click(); }
  if (ev.key === 'Escape' && S.sheetOpen) closeSheet();
});
window.addEventListener('popstate', function () {
  if (S.ignorePop) { S.ignorePop = false; syncHash(); return; }
  if (S.sheetOpen) { closeSheet(true); return; }
  var t = (location.hash || '').slice(1);
  if (TABS.indexOf(t) >= 0 && t !== S.tab && S.auth && S.auth.token && S.auth.name) { S.tab = t; render(); }
});
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && S.auth && S.auth.token && S.auth.name && S.busy === 0 && Date.now() - S.loadedAt > 30000) refresh(true);
});
setInterval(function () {
  if (document.hidden || !S.auth || !S.auth.token || !S.auth.name || S.sheetOpen || S.busy > 0) return;
  if (Date.now() - S.loadedAt > 90000) refresh(true); else render(true);
}, 20000);

/* ───────── 시작 ───────── */
var hash = (location.hash || '').slice(1);
if (TABS.indexOf(hash) >= 0) S.tab = hash;
if (S.auth && S.auth.token && S.auth.name) { render(); refresh(true); }
else { S.data = null; renderLogin(); }
})();

</script>
</body>
</html>
